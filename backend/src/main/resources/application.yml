spring:
  application:
    name: Game_Chronicle
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      connection-timeout: 10000
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
      table-name: chronicle.spring_session
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        name: GCSESSION
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
mybatis:
  type-handlers-package: com.gamechronicle
  configuration:
    map-underscore-to-camel-case: true
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  steam-key: ${STEAM_API_KEY:}
  tracking-enabled: ${TRACKING_ENABLED:false}
